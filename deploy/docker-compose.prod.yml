
services:
  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.backend
    container_name: life-planner-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////app/data/life_planner.db
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in deploy/.env}
      JWT_SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in deploy/.env}
      DEBUG: "false"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TZ: Asia/Shanghai
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - life-planner

  frontend:
    build:
      context: ../frontend
      dockerfile: ../deploy/Dockerfile.frontend
    container_name: life-planner-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - life-planner

volumes:
  backend_data:

networks:
  life-planner:
    driver: bridge
