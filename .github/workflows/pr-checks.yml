name: PR Checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Syntax check (compileall)
        # The suite, mypy, and the frontend build live in ci.yml via make check.
        # This job only byte-compiles. A syntax error must fail the job.
        run: python -m compileall -q .
