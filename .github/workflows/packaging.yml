name: Packaging
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Build distributions
        run: |
          set -euo pipefail
          # A pyproject.toml that only holds tool config is not a package.
          if python -c 'import pathlib,sys,tomllib; d=tomllib.loads(pathlib.Path("pyproject.toml").read_text()); sys.exit(0 if ("build-system" in d or "project" in d) else 1)'; then
            python -m pip install --quiet build
            python -m build --sdist --wheel --outdir dist/
          else
            echo "pyproject.toml has no [project] or [build-system]; not a distributable package. skipping build"
          fi
      - name: Upload dist artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist
          path: dist/
